name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "26"
          cache: pnpm

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      # Deployments live in each instance's config repo. CI builds with the example instance.
      - name: Use the example instance
        run: test -d instance || cp -R instance.example instance

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and typecheck
        run: pnpm run build

      - name: Test
        run: pnpm test
