# The Slack app for access requests (napConfig.accessRequests with "slack"). Create it at
# https://api.slack.com/apps → Create New App → From a manifest, paste this, and replace
# <root> with the Nap's domain. Install it to the workspace, then set the config repository
# secrets NAP_SLACK_BOT_TOKEN (OAuth & Permissions → Bot User OAuth Token) and
# NAP_SLACK_SIGNING_SECRET (Basic Information → Signing Secret).
display_information:
  name: Nap
  description: Tells you when someone asks for access to your naps.
  background_color: "#18181b"
features:
  # Requests arrive in the app's Messages tab. Nobody needs to write back.
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: true
  bot_user:
    display_name: Nap
    always_online: false
oauth_config:
  scopes:
    bot:
      - chat:write
      - users:read
      - users:read.email
settings:
  interactivity:
    is_enabled: true
    request_url: https://<root>/_nap/hooks/slack
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
